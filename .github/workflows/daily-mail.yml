name: Daily News Mail

on:
  workflow_dispatch:
  schedule:
    # 03:10 UTC = 11:10 China Standard Time (UTC+8)
    - cron: "10 3 * * *"

permissions:
  contents: read

jobs:
  daily-news-brief:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect news, generate brief, and send email
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AGENTMAIL_API_KEY: ${{ secrets.AGENTMAIL_API_KEY }}
        run: python daily_briefing.py
