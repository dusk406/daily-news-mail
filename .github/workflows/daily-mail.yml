name: Daily News Mail

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

jobs:
  send-test-mail:
    runs-on: ubuntu-latest
    steps:
      - name: Send test email via AgentMail
        env:
          AGENTMAIL_API_KEY: ${{ secrets.AGENTMAIL_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import json
          import urllib.request
          import urllib.error

          api_key = os.environ["AGENTMAIL_API_KEY"]
          url = "https://api.agentmail.to/v0/inboxes/thankfulproduct663@agentmail.to/messages/send"

          payload = {
              "to": "wuque_061@163.com",
              "subject": "每日趋势简报｜自动发送测试",
              "text": "这是一封由 GitHub Actions 通过 AgentMail 自动发送的测试邮件。\n\n如果你收到这封邮件，说明 GitHub Actions → AgentMail → 163 邮箱的发送链路已经打通。"
          }

          req = urllib.request.Request(
              url,
              data=json.dumps(payload).encode("utf-8"),
              headers={
                  "Authorization": f"Bearer {api_key}",
                  "Content-Type": "application/json",
              },
              method="POST",
          )

          try:
              with urllib.request.urlopen(req) as resp:
                  print("HTTP STATUS:", resp.status)
                  print("RESPONSE BODY:")
                  print(resp.read().decode("utf-8"))
          except urllib.error.HTTPError as e:
              print("HTTP STATUS:", e.code)
              print("RESPONSE BODY:")
              print(e.read().decode("utf-8"))
              raise
          PY
